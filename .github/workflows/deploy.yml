name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.2"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # Step 1: Export Godot project to HTML5
  # ──────────────────────────────────────────────
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + templates
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot
        run: |
          if [ ! -f /usr/local/bin/godot ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
            unzip -o /tmp/godot.zip -d /tmp/godot
            sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
            sudo chmod +x /usr/local/bin/godot
          fi

      - name: Install export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TEMPLATES_DIR/web_nothreads_release.zip" ]; then
            mkdir -p "$TEMPLATES_DIR"
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
            unzip -o /tmp/templates.tpz "templates/*web*" -d /tmp/tpl
            cp /tmp/tpl/templates/web_*.zip "$TEMPLATES_DIR/"
          fi

      - name: Export HTML5
        run: |
          mkdir -p export/web
          godot --headless --path . --export-release "Web" export/web/index.html

      - name: Verify export
        run: |
          test -f export/web/index.html || (echo "Export failed" && exit 1)
          echo "Export size: $(du -sh export/web/ | cut -f1)"
          ls -la export/web/

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: paintball-web
          path: export/web/
          retention-days: 30

  # ──────────────────────────────────────────────
  # Step 2: Deploy to curlyphries.net (main only)
  # Triggers a webhook that the server listens for
  # ──────────────────────────────────────────────
  deploy:
    needs: export
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger deploy webhook
        run: |
          # Fail the job if the deploy fails — a swallowed error here means
          # green CI while the live site is broken
          curl -sf --max-time 300 -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.sha }}","artifact":"paintball-web"}' \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}"
          echo "Deploy succeeded"

      - name: Verify site is serving
        run: |
          sleep 5
          curl -sf -o /dev/null "https://curlyphries.net/paintball/" \
            && echo "Site is live" \
            || (echo "::error::Site is not serving after deploy" && exit 1)

  # ──────────────────────────────────────────────
  # Step 3: Docker images to GHCR (tags only)
  # ──────────────────────────────────────────────
  docker:
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download export
        uses: actions/download-artifact@v4
        with:
          name: paintball-web
          path: export/web/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Relay server image
      - name: Build & push relay image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/relay:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/relay:latest

      # All-in-one image (relay + web server)
      - name: Build & push all-in-one image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ──────────────────────────────────────────────
  # Step 4: GitHub Release (tags only)
  # ──────────────────────────────────────────────
  release:
    needs: [export, docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download export
        uses: actions/download-artifact@v4
        with:
          name: paintball-web
          path: paintball-web/

      - name: Create release zip
        run: |
          cd paintball-web && zip -r ../paintball-web.zip . && cd ..
          echo "Release archive: $(du -sh paintball-web.zip | cut -f1)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: paintball-web.zip
