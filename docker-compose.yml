services:
  relay:
    build: ./server
    ports:
      - "${RELAY_PORT:-9090}:9090"
    restart: unless-stopped
    environment:
      - PORT=9090
      # Bind all interfaces — a loopback bind inside the container is
      # unreachable through the port mapping
      - HOST=0.0.0.0

  # Static file server for the HTML5 game export
  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./export/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - relay
