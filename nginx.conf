server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Required headers for Godot HTML5 exports (SharedArrayBuffer support)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    
    # AGGRESSIVE NO-CACHE - disable all caching
    add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "-1" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # All files - no caching whatsoever
    location ~* \.(wasm|pck|js|worker\.js|png|jpg|svg|ico|html)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "-1" always;
    }
}
