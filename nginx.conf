server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Required headers for Godot HTML5 exports (SharedArrayBuffer support)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Always revalidate (no-cache), never skip the cache entirely (no-store).
    # Godot export filenames are stable, so browsers get 304s for unchanged
    # .wasm/.pck instead of re-downloading the whole game every visit.
    add_header Cache-Control "no-cache" always;

    # WebSocket relay — the client derives its relay URL as <origin>/ws
    location /ws {
        proxy_pass http://relay:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
