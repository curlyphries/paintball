server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Required headers for Godot HTML5 exports (SharedArrayBuffer support)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    
    # Default cache policy - must-revalidate ensures hard refresh works
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets - short cache with revalidation
    location ~* \.(wasm|pck|js|worker\.js|png|jpg|svg|ico)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }
}
